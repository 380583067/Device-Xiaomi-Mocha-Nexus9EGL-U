# UART device port where Bluetooth controller is attached
UartPort = /dev/ttyTHS2

# Firmware patch file location
FwPatchFilePath = /vendor/firmware/

# ---------------------------------------------------------------------------
# The three keys below are read by brcm-uim-sysfs itself. They are a completely
# separate key namespace from the UartPort / FwPatchFilePath keys read by the
# Bluedroid vendor library above; the two sets simply coexist in one file.
#
# FIX (FM, 2026-11-16, measured on device):
# The vendor_conf_table in brcm-uim-sysfs (uim.c:483) only recognises
# UimUartPort, not UartPort. And the compiled-in default for uart_port_name in
# uim.c:114 is "/dev/ttyHS0", which is the serial port name used on Qualcomm
# devices - on this device (Tegra K1) it is /dev/ttyTHS2. Without an override,
# uim opens a serial port that does not exist and every FM mode switch fails.
UimUartPort = /dev/ttyTHS2

# The default cust_baud_rate in uim.c:112 is already 3000000. It is spelled out
# here only so the configuration file is self-documenting; the value matches the
# standard Broadcom Bluetooth HCI baud rate.
UartBaudRate = 3000000

# uim needs to know the firmware file name when it pushes patchram. The actual
# name under /vendor/firmware on this device is BCM4350C0.hcd, even though the
# chip is marketed as BCM4354 - this is the file Xiaomi shipped.
# Note: during a normal boot the BT firmware is downloaded by the Bluedroid
# vendor library, and this uim path is only used when uim has to take over
# patchram itself. It is filled in so that branch cannot fail on an empty file
# name.
FwPatchFileName = BCM4350C0.hcd
