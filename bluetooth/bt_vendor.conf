# UART device port where Bluetooth controller is attached
UartPort = /dev/ttyTHS2

# Firmware patch file location
FwPatchFilePath = /vendor/firmware/

# ---------------------------------------------------------------------------
# 以下三段是 brcm-uim-sysfs 自己读的键，与上面 Bluedroid vendor 库读的
# UartPort / FwPatchFilePath 是**两套互不相干的键名**，同一个文件里并存即可。
#
# 修复说明（FM，2026-11-16，真机实测）：
# brcm-uim-sysfs 的 vendor_conf_table（uim.c:483）只认 UimUartPort，不认 UartPort。
# 而 uim.c:114 里 uart_port_name 的编译默认值是 "/dev/ttyHS0" —— 那是高通机器的
# 串口名，本机（Tegra K1）是 /dev/ttyTHS2。不覆盖的话 uim 会去 open 一个不存在的
# 串口，FM 模式切换必然失败。
UimUartPort = /dev/ttyTHS2

# uim.c:112 的默认 cust_baud_rate 正好是 3000000，这里显式写出来只是为了
# 让配置文件自解释；数值与 Broadcom 蓝牙 HCI 的标准波特率一致。
UartBaudRate = 3000000

# uim 在下发 patchram 时需要知道固件文件名。本机 /vendor/firmware 下实际文件名
# 是 BCM4350C0.hcd（虽然芯片型号标称 BCM4354，Xiaomi 打包的固件就是这个）。
# 注意：正常开机时 BT 的固件下载由 Bluedroid 的 vendor 库完成，uim 这段只在
# 它需要自己接管 patchram 时用到，填上是为了避免走到该分支时因为文件名为空而失败。
FwPatchFileName = BCM4350C0.hcd
