# UART device port where Bluetooth controller is attached
UartPort = /dev/ttyTHS2

# Firmware patch file location
FwPatchFilePath = /vendor/firmware/

# ---------------------------------------------------------------------------
# The three sections below are keys brcm-uim-sysfs reads on its own. UartPort and
# FwPatchFilePath are **two unrelated key sets** that simply coexist in one file.
#
# FM fix (2026-11-16, measured on the device): brcm-uim-sysfs's vendor_conf_table
# (uim.c:483) only knows UimUartPort, not UartPort. uim.c:114 compiles in
# "/dev/ttyHS0" as the default uart_port_name - a Qualcomm serial port, while this
# device (Tegra K1) uses /dev/ttyTHS2. Without the override uim opens a port that
# does not exist and the FM mode switch always fails.
UimUartPort = /dev/ttyTHS2

# uim.c:112 already defaults cust_baud_rate to 3000000; it is spelled out only to
# make the file self-documenting, and it matches the standard Broadcom BT HCI rate.
UartBaudRate = 3000000

# uim needs the firmware file name when it pushes patchram. The real file under
# /vendor/firmware is BCM4350C0.hcd (the chip is sold as BCM4354, but this is what
# Xiaomi shipped). Note: on a normal boot Bluedroid's vendor library does the BT
# firmware download and uim only needs this when it takes over patchram itself; it is
# filled in so that branch does not fail on an empty name.
FwPatchFileName = BCM4350C0.hcd
